log:
  level: error
  production: false

include: []

plugins:
  - tag: forward_clean
    type: forward
    args:
      concurrent: 10
      upstreams:
        - addr: tcp://100.100.100.100
  - tag: main_sequence
    type: sequence
    args:
      - exec: prefer_ipv4
      - exec: $forward_clean
  - tag: udp_server
    type: udp_server
    args:
      entry: main_sequence
      listen: 127.0.0.1:55555
  - tag: tcp_server
    type: tcp_server
    args:
      entry: main_sequence
      listen: 127.0.0.1:55555