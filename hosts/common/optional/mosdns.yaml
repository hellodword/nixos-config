log:
  level: error
  production: false

include: []

plugins:
  - tag: forward_clean
    type: forward
    args:
      concurrent: 10
      upstreams:
        # - tag: demo
        #   addr: "https://dns.google/dns-query"
        #   dial_addr: "8.8.8.8"
        #   bootstrap: "8.8.8.8"
        #   bootstrap_version: 4
        #   socks5: "127.0.0.1:1080"
        #   idle_timeout: 30
        #   enable_pipeline: false
        #   enable_http3: false
        #   max_conns: 2
        #   insecure_skip_verify: false
        #   so_mark: 0
        #   bind_to_device: ""

        # DoH3 穿墙能力很好，但现有工具不方便测试，可能需要写点代码
        # - addr: https://
        #   enable_http3: true

        # google
        # 8.8.8.8 更可能被墙，dns.google 的所有 DoH 一般也被墙
        - addr: tls://8.8.4.4
          enable_pipeline: true
        # - addr: tls://2001:4860:4860:0:0:0:0:8844
        #   enable_pipeline: true
        # - addr: tls://2001:4860:4860:0:0:0:0:6464
        #   enable_pipeline: true
        # - addr: tls://2001:4860:4860:0:0:0:0:8888
        #   enable_pipeline: true
        # - addr: tls://2001:4860:4860:0:0:0:0:64
        #   enable_pipeline: true
        # - addr: https://2001:4860:4860:0:0:0:0:64
        #   enable_http3: true
        # Quard9
        - addr: tls://9.9.9.12
          enable_pipeline: true
        # - addr: tls://2620:fe::12
        #   enable_pipeline: true
        # - addr: tls://2620:fe::fe:12
        #   enable_pipeline: true
  - tag: ecs_us
    type: ecs_handler
    args:
      forward: false
      preset: 140.82.112.3
      send: true
      mask4: 24
      mask6: 48
  - tag: main_sequence
    type: sequence
    args:
      # - exec: prefer_ipv4
      - exec: $ecs_us
      - exec: $forward_clean
  - tag: udp_server
    type: udp_server
    args:
      entry: main_sequence
      listen: 127.0.0.1:55553
  - tag: tcp_server
    type: tcp_server
    args:
      entry: main_sequence
      listen: 127.0.0.1:55553
