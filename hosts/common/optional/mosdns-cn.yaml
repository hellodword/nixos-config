log:
  level: error
  production: false

include: []

plugins:
  - tag: forward_clean
    type: forward
    args:
      concurrent: 10
      upstreams:
        - addr: tls://120.53.53.53
          enable_pipeline: true
        - addr: tls://1.12.12.12
          enable_pipeline: true
        - addr: tls://223.5.5.5
          enable_pipeline: true
        - addr: tls://223.6.6.6
          enable_pipeline: true
  - tag: main_sequence
    type: sequence
    args:
      - exec: prefer_ipv4
      - exec: $forward_clean
  - tag: udp_server
    type: udp_server
    args:
      entry: main_sequence
      listen: 127.0.0.1:55554
  - tag: tcp_server
    type: tcp_server
    args:
      entry: main_sequence
      listen: 127.0.0.1:55554
