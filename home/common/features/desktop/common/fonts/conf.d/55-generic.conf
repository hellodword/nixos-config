<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

    <match>
      <test name=“family” compare=“eq”>
       <string>sans-serif</string>
      </test>
      <test name=“family” compare=“eq”>
        <string>monospace</string>
      </test>
      <edit name=“family” mode=“delete”/>
    </match>

  <!-- Default system-ui fonts -->
  <match target="pattern">
    <test name="family">
      <string>system-ui</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>sans-serif</string>
    </edit>
  </match>

  <!-- Default sans-serif fonts-->
  <match target="pattern">
    <test name="family">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans</string>
      <string>LXGW WenKai</string>
      <string>Symbols Nerd Font</string>
      <string>Noto Color Emoji</string>
      <string>Jigmo</string>
      <string>Jigmo2</string>
      <string>Jigmo3</string>
    </edit>
  </match>

  <!-- Default serif fonts-->
  <match target="pattern">
    <test name="family">
      <string>serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Serif</string>
      <string>LXGW WenKai</string>
      <string>Symbols Nerd Font</string>
      <string>Noto Color Emoji</string>
      <string>Jigmo</string>
      <string>Jigmo2</string>
      <string>Jigmo3</string>
    </edit>
  </match>

  <!-- Default monospace fonts-->
  <match target="pattern">
    <test name="family">
      <string>monospace</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans Mono</string>
      <string>LXGW WenKai Mono</string>
      <string>Symbols Nerd Font</string>
      <string>Noto Color Emoji</string>
      <string>Jigmo</string>
      <string>Jigmo2</string>
      <string>Jigmo3</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" compare="contains">
      <string>Noto Sans CJK</string>
    </test>
    <edit name="family" mode="prepend" binding="same">
      <string>LXGW WenKai</string>
    </edit>
  </match>


  <match target="pattern">
    <test name="lang">
      <string>zh-TW</string>
    </test>
    <test name="family">
      <string>LXGW WenKai</string>
    </test>
    <edit name="family" binding="same">
      <string>Fusion Kai T</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="lang">
      <string>ja</string>
    </test>
    <test name="family">
      <string>LXGW WenKai</string>
    </test>
    <edit name="family" binding="same">
      <string>Fusion Kai J</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="lang">
      <string>ko</string>
    </test>
    <test name="family">
      <string>LXGW WenKai</string>
    </test>
    <edit name="family" binding="same">
      <string>Noto Sans CJK KR</string>
    </edit>
  </match>

</fontconfig>
