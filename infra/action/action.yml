name: Shared Nix CI Runner
description: Isolated Nix CI container setup, oranc bootstrap cache, manifest evaluation, build groups, signed OCI cache publication, and diagnostics

inputs:
  mode:
    description: Execution mode (env, initialize-cache, verify, publish-cache, finalize)
    required: false
    default: verify
  project-dir:
    description: Consumer repository directory relative to GITHUB_WORKSPACE
    required: false
    default: .
  manifest:
    description: CI manifest path relative to project-dir
    required: false
    default: nix/ci.nix
  select:
    description: JSON selection object passed to the CI manifest
    required: false
    default: '{}'
  enable-kvm:
    description: Load KVM module and pass /dev/kvm into the Nix build container
    required: false
    default: 'true'
  reclaim-disk:
    description: Remove unused Hosted Runner SDK directories and enable 8 GiB swap
    required: false
    default: 'true'
  run-builds:
    description: Execute evaluated manifest build groups and verify required targets
    required: false
    default: 'true'
  publish-cache:
    description: Publish redistributable store paths to the configured signed OCI cache
    required: false
    default: 'false'
  signing-key:
    description: Ed25519 signing secret key for OCI cache publication
    required: false
    default: ''
  pre-build-command:
    description: Optional shell command executed inside the build container after ci-tools and cache proxy are ready
    required: false
    default: ''
  keep-container:
    description: Keep the Nix build container and store volume alive after verify for subsequent release/cache steps
    required: false
    default: 'false'
  artifact-suffix:
    description: Label appended to the uploaded diagnostics artifact name
    required: false
    default: default

outputs:
  state-dir:
    description: Host path to the isolated CI state directory
    value: ${{ steps.export-env.outputs.state-dir }}
  container-name:
    description: Running Docker container name for subsequent workflow steps
    value: ${{ steps.export-env.outputs.container-name }}
  cache-result:
    description: Exit outcome of end-of-phase cache publication (success, failed, skipped)
    value: ${{ steps.cache-publish.outputs.result }}

runs:
  using: composite
  steps:
    - name: Initialize isolated CI state and environment
      id: export-env
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        GITHUB_TOKEN: ${{ github.token }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_PROJECT_DIR: ${{ inputs.project-dir }}
        INPUT_ENABLE_KVM: ${{ inputs.enable-kvm }}
      run: |
        set -euo pipefail
        infra_dir=$(cd -- "$ACTION_PATH/.." && pwd)
        project_dir=$(cd -- "$GITHUB_WORKSPACE/$INPUT_PROJECT_DIR" && pwd)
        run_tag="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        state="$RUNNER_TEMP/nix-ci-${run_tag}"
        build_tmp="$RUNNER_TEMP/nix-build-${run_tag}"
        container_name="nix-ci-${run_tag}"
        publisher_name="nix-ci-publisher-${run_tag}"
        store_volume="nix-ci-store-${run_tag}"
        nix_image="docker.io/nixos/nix@sha256:53b5ec518b696373829ea305c3c07a8c870113e44648c88ec484ef078550fd4f"

        mkdir -p "$state" "$build_tmp"
        if [[ ! -f "$state/nix-base.conf" ]]; then
          features="nixos-test benchmark big-parallel"
          if [[ "$INPUT_ENABLE_KVM" == true ]]; then
            features="$features kvm"
          fi
          cat > "$state/nix-base.conf" <<CONFIG
        experimental-features = nix-command flakes
        sandbox = false
        accept-flake-config = false
        system-features = $features
        max-jobs = 1
        cores = 0
        fallback = true
        max-substitution-jobs = 4
        http-connections = 8
        substituters = https://cache.nixos.org https://nix-community.cachix.org https://cache.numtide.com
        trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=
        require-sigs = true
        CONFIG
          cp "$state/nix-base.conf" "$state/nix.conf"
        fi

        cat > "$state/gitconfig" <<'GITCONFIG'
        [safe]
          directory = /workspace
          directory = /infra
          directory = *
        GITCONFIG

        nix_config=$(printf 'experimental-features = nix-command flakes\naccess-tokens = github.com=%s\n' "$GITHUB_TOKEN")
        delimiter="EOF_$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')"
        {
          printf 'NIX_IMAGE=%s\n' "$nix_image"
          printf 'NIX_CI_STATE=%s\n' "$state"
          printf 'NIX_CI_BUILD_TMP=%s\n' "$build_tmp"
          printf 'NIX_CI_CONTAINER=%s\n' "$container_name"
          printf 'NIX_CI_PUBLISHER=%s\n' "$publisher_name"
          printf 'NIX_CI_STORE_VOLUME=%s\n' "$store_volume"
          printf 'NIX_CI_INFRA_DIR=%s\n' "$infra_dir"
          printf 'NIX_CI_PROJECT_DIR=%s\n' "$project_dir"
          printf 'NIX_USER_CONF_FILES=/ci/nix.conf\n'
          printf 'ORANC_CACHE_MAX_BYTES=536870912\n'
          printf 'NIX_CONFIG<<%s\n%s\n%s\n' "$delimiter" "$nix_config" "$delimiter"
        } >> "$GITHUB_ENV"

        {
          printf 'state-dir=%s\n' "$state"
          printf 'container-name=%s\n' "$container_name"
        } >> "$GITHUB_OUTPUT"

    - name: Initialize GHCR cache package
      if: inputs.mode == 'initialize-cache'
      shell: bash
      env:
        ORANC_USERNAME: ${{ github.actor }}
        ORANC_PASSWORD: ${{ github.token }}
        INPUT_MANIFEST: ${{ inputs.manifest }}
        INPUT_SELECT: ${{ inputs.select }}
      run: |
        set -euo pipefail
        test "$GITHUB_REF" = refs/heads/master
        bash "$NIX_CI_INFRA_DIR/ci/container.sh" --rm -i --memory=12g --memory-swap=20g \
          --volume "$NIX_CI_PROJECT_DIR:/workspace:ro" \
          --volume "$NIX_CI_INFRA_DIR:/infra:ro" \
          --volume "$NIX_CI_STATE:/ci:ro" \
          --env ORANC_USERNAME \
          --env ORANC_PASSWORD \
          --env INPUT_MANIFEST \
          --env INPUT_SELECT \
          -- bash -euo pipefail <<'BASH'
        oranc_root=$(nix build --no-update-lock-file --no-link --print-out-paths /infra#oranc)
        repository=$(nix eval --no-update-lock-file --impure --raw --expr '
          let
            flake = builtins.getFlake ("git+file:///workspace");
            manifest = import ("/workspace/" + builtins.getEnv "INPUT_MANIFEST") {
              inherit flake;
              select = builtins.fromJSON (builtins.getEnv "INPUT_SELECT");
            };
          in manifest.cache.repository
        ')
        "$oranc_root/bin/oranc" push --repository "$repository" --parallel 1 initialize --priority 41
        BASH
        cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
        ## Cache package initialized

        Open GitHub Packages -> cache package -> Package settings.
        Set visibility to Public, disable inherited repository access, and grant this repository Actions Write access.
        SUMMARY

    - name: Prepare disk, swap, KVM, and Nix container
      if: inputs.mode == 'verify'
      shell: bash
      env:
        INPUT_ENABLE_KVM: ${{ inputs.enable-kvm }}
        INPUT_RECLAIM_DISK: ${{ inputs.reclaim-disk }}
      run: |
        set -euo pipefail
        date -u +%FT%TZ > "$NIX_CI_STATE/started"
        df -h / /mnt || df -h /
        if [[ "$INPUT_RECLAIM_DISK" == true ]]; then
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /usr/share/swift /usr/local/share/boost
          if [[ ! -f "$NIX_CI_STATE/swap" ]]; then
            sudo fallocate -l 8G "$NIX_CI_STATE/swap"
            sudo chmod 600 "$NIX_CI_STATE/swap"
            sudo mkswap "$NIX_CI_STATE/swap"
            sudo swapon "$NIX_CI_STATE/swap"
          fi
        fi
        free -h
        kvm_args=()
        if [[ "$INPUT_ENABLE_KVM" == true ]]; then
          sudo modprobe kvm
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm
          kvm_args+=(--device /dev/kvm)
        fi
        docker volume create "$NIX_CI_STORE_VOLUME" >/dev/null
        bash "$NIX_CI_INFRA_DIR/ci/container.sh" --detach --name "$NIX_CI_CONTAINER" \
          "${kvm_args[@]}" \
          --memory=12g --memory-swap=20g \
          --volume "$NIX_CI_STORE_VOLUME:/nix" \
          --volume "$NIX_CI_PROJECT_DIR:/workspace:ro" \
          --volume "$NIX_CI_INFRA_DIR:/infra:ro" \
          --volume "$NIX_CI_STATE:/ci" \
          --volume "$NIX_CI_BUILD_TMP:/build" \
          --env TMPDIR=/build \
          -- sleep infinity
        container_pid=$(docker inspect --format '{{.State.Pid}}' "$NIX_CI_CONTAINER")
        python3 "$NIX_CI_INFRA_DIR/ci" report monitor --state "$NIX_CI_STATE" --container-pid "$container_pid" \
          > "$NIX_CI_STATE/monitor.log" 2>&1 &

    - name: Identify oranc store path
      id: oranc-key
      if: inputs.mode == 'verify'
      shell: bash
      run: |
        set -euo pipefail
        docker exec "$NIX_CI_CONTAINER" bash -euo pipefail -c \
          'nix eval --no-update-lock-file --raw /infra#oranc.outPath > /ci/oranc-root'
        oranc_root=$(cat "$NIX_CI_STATE/oranc-root")
        printf 'key=oranc-v1-%s-%s-%s-%s\n' \
          "$RUNNER_OS" "$RUNNER_ARCH" "$ORANC_CACHE_MAX_BYTES" "${oranc_root##*/}" >> "$GITHUB_OUTPUT"

    - name: Restore oranc bootstrap cache
      id: oranc-restore
      if: inputs.mode == 'verify'
      uses: actions/cache/restore@v6
      continue-on-error: true
      with:
        path: ${{ steps.export-env.outputs.state-dir }}/oranc-closure
        key: ${{ steps.oranc-key.outputs.key }}

    - name: Import or build oranc
      id: oranc
      if: inputs.mode == 'verify'
      shell: bash
      run: |
        set -euo pipefail
        python3 "$NIX_CI_INFRA_DIR/ci" report run --state "$NIX_CI_STATE" --phase oranc -- \
          docker exec -i "$NIX_CI_CONTAINER" bash -euo pipefail <<'BASH'
        if [[ -f /ci/oranc-closure ]]; then
          if nix-store --import < /ci/oranc-closure; then
            echo 'Imported' > /ci/oranc-import
          else
            echo '::warning::Unable to import the oranc cache; continuing with normal Nix build.'
            echo 'Failed; using normal Nix build' > /ci/oranc-import
          fi
        else
          echo 'No archive; using normal Nix build' > /ci/oranc-import
        fi
        oranc_root=$(nix build --no-update-lock-file --no-link --print-out-paths /infra#oranc)
        printf '%s\n' "$oranc_root" > /ci/oranc-root
        printf '%s\n' "$oranc_root/bin/oranc" > /ci/oranc
        nix path-info --closure-size "$oranc_root" > /ci/oranc-size
        BASH

    - name: Export oranc bootstrap archive
      id: oranc-export
      if: inputs.mode == 'verify' && github.ref == 'refs/heads/master' && steps.oranc-restore.outputs.cache-hit != 'true'
      continue-on-error: true
      shell: bash
      run: |
        set -euo pipefail
        read -r _ closure_bytes < "$NIX_CI_STATE/oranc-size"
        if (( closure_bytes > ORANC_CACHE_MAX_BYTES )); then
          echo 'skip-reason=Runtime closure exceeds the size limit' >> "$GITHUB_OUTPUT"
          exit 0
        fi
        archive="$NIX_CI_STATE/oranc-closure"
        trap 'rm -f "$archive.partial"' EXIT
        docker exec "$NIX_CI_CONTAINER" bash -euo pipefail -c '
          nix-store --query --requisites "$(cat /ci/oranc-root)" > /ci/oranc-paths
          mapfile -t paths < /ci/oranc-paths
          nix-store --export "${paths[@]}"
        ' > "$archive.partial"
        archive_bytes=$(stat -c %s "$archive.partial")
        echo "archive-bytes=$archive_bytes" >> "$GITHUB_OUTPUT"
        if (( archive_bytes > ORANC_CACHE_MAX_BYTES )); then
          echo 'skip-reason=Exported archive exceeds the size limit' >> "$GITHUB_OUTPUT"
          exit 0
        fi
        mv "$archive.partial" "$archive"
        echo 'ready=true' >> "$GITHUB_OUTPUT"

    - name: Save oranc bootstrap cache
      id: oranc-save
      if: inputs.mode == 'verify' && github.ref == 'refs/heads/master' && steps.oranc-export.outputs.ready == 'true'
      uses: actions/cache/save@v6
      continue-on-error: true
      with:
        path: ${{ steps.export-env.outputs.state-dir }}/oranc-closure
        key: ${{ steps.oranc-key.outputs.key }}

    - name: Start local oranc proxy, build ci-tools, and evaluate manifest
      if: inputs.mode == 'verify'
      shell: bash
      env:
        ORANC_USERNAME: ${{ github.actor }}
        ORANC_PASSWORD: ${{ github.token }}
        INPUT_MANIFEST: ${{ inputs.manifest }}
        INPUT_SELECT: ${{ inputs.select }}
        INPUT_PRE_BUILD: ${{ inputs.pre-build-command }}
      run: |
        set -euo pipefail
        (
          umask 077
          printf 'machine 127.0.0.2\nlogin %s\npassword %s\n' \
            "$ORANC_USERNAME" "$ORANC_PASSWORD" > "$NIX_CI_STATE/oranc.netrc"
        )
        python3 "$NIX_CI_INFRA_DIR/ci" report run --state "$NIX_CI_STATE" --phase tools -- \
          docker exec -i \
            --env INPUT_MANIFEST \
            --env INPUT_SELECT \
            "$NIX_CI_CONTAINER" bash -euo pipefail <<'BASH'
        tools_root=$(nix build --no-update-lock-file --no-link --print-out-paths /infra#ci-tools)
        printf '%s\n' "$tools_root" > /ci/tools
        printf '%s/bin/python3\n' "$tools_root" > /ci/python
        export PATH="$tools_root/bin:$PATH"

        RUST_LOG=oranc=info,oranc::registry=debug \
          "$(cat /ci/oranc)" server --listen 127.0.0.2:37515 < /dev/null 2>&1 | \
          python3 -u -c '
        import datetime, sys
        for line in sys.stdin:
            print(datetime.datetime.now(datetime.timezone.utc).isoformat() + " " + line.rstrip())
        ' > /ci/oranc.log 2>&1 &
        proxy_pid=$!
        for ((attempt=0; attempt<50; attempt++)); do
          if (exec 3<>/dev/tcp/127.0.0.2/37515) 2>/dev/null; then break; fi
          kill -0 "$proxy_pid"
          sleep 0.1
        done

        nix-ci evaluate --project-dir /workspace --manifest "$INPUT_MANIFEST" --select "$INPUT_SELECT" --state /ci

        python3 - <<'PY'
        import json
        from pathlib import Path
        import urllib.request

        manifest = json.loads(Path("/ci/manifest.json").read_text())
        cache = manifest.get("cache")
        if cache:
            subs = cache.get("readSubstituters") or []
            keys = cache.get("trustedPublicKeys") or []
            for uri in subs:
                if uri.startswith("http://127.0.0.2:"):
                    with urllib.request.urlopen(uri.rstrip("/") + "/nix-cache-info", timeout=30) as response:
                        body = response.read().decode()
                    if "StoreDir: /nix/store" not in body:
                        raise SystemExit(f"Unexpected nix-cache-info from {uri}")
            base_lines = [
                line for line in Path("/ci/nix-base.conf").read_text().splitlines()
                if not line.startswith(("substituters =", "trusted-public-keys =", "extra-substituters =", "extra-trusted-public-keys ="))
            ]
            base_lines.append("substituters = " + " ".join(subs))
            base_lines.append("trusted-public-keys = " + " ".join(keys))
            base_lines.append("netrc-file = /ci/oranc.netrc")
            Path("/ci/nix.conf").write_text("\n".join(base_lines) + "\n")
        PY
        BASH

        if [[ -n "$INPUT_PRE_BUILD" ]]; then
          docker exec "$NIX_CI_CONTAINER" bash -euo pipefail -c \
            "export PATH=\"\$(cat /ci/tools)/bin:\$PATH\"; $INPUT_PRE_BUILD"
        fi

    - name: Verify cache signing key and start incremental publisher
      id: publisher
      if: inputs.mode == 'verify' && inputs.publish-cache == 'true'
      shell: bash
      env:
        ORANC_USERNAME: ${{ github.actor }}
        ORANC_PASSWORD: ${{ github.token }}
        ORANC_SIGNING_KEY: ${{ inputs.signing-key }}
      run: |
        set -euo pipefail
        cache_mode=$(jq -r '.cache.mode // "none"' "$NIX_CI_STATE/manifest.json")
        if [[ "$cache_mode" == none ]]; then
          exit 0
        fi
        bash "$NIX_CI_INFRA_DIR/ci/container.sh" --rm -i \
          --volume "$NIX_CI_STORE_VOLUME:/nix:ro" \
          --volume "$NIX_CI_PROJECT_DIR:/workspace:ro" \
          --volume "$NIX_CI_INFRA_DIR:/infra:ro" \
          --volume "$NIX_CI_STATE:/ci:ro" \
          --env ORANC_USERNAME \
          --env ORANC_PASSWORD \
          --env ORANC_SIGNING_KEY \
          -- bash -euo pipefail <<'BASH'
        export PATH="$(cat /ci/tools)/bin:$PATH"
        expected=$(jq -r '.cache.publicKey' /ci/manifest.json)
        actual=$(printf '%s' "$ORANC_SIGNING_KEY" | nix key convert-secret-to-public)
        if [[ "$actual" != "$expected" ]]; then
          echo 'NIX_CACHE_SIGNING_KEY does not match the declared cache public key.' >&2
          exit 1
        fi
        repository=$(jq -r '.cache.repository' /ci/manifest.json)
        registry=$(jq -r '.cache.registry // "ghcr.io"' /ci/manifest.json)
        "$(cat /ci/oranc)" push --registry "$registry" --repository "$repository" --parallel 1 initialize --priority 41
        BASH

        if [[ "$cache_mode" == incremental ]]; then
          bash "$NIX_CI_INFRA_DIR/ci/container.sh" --detach --name "$NIX_CI_PUBLISHER" \
            --network "container:$NIX_CI_CONTAINER" \
            --memory=12g --memory-swap=20g \
            --volume "$NIX_CI_STORE_VOLUME:/nix" \
            --volume "$NIX_CI_PROJECT_DIR:/workspace:ro" \
            --volume "$NIX_CI_INFRA_DIR:/infra:ro" \
            --volume "$NIX_CI_STATE:/ci" \
            --env ORANC_USERNAME \
            --env ORANC_PASSWORD \
            --env ORANC_SIGNING_KEY \
            -- sleep infinity
          docker exec "$NIX_CI_PUBLISHER" bash -euo pipefail -c \
            'export PATH="$(cat /ci/tools)/bin:$PATH"; nix-ci cache start --project-dir /workspace --state /ci'
        fi

    - name: Build manifest execution groups and verify required targets
      if: inputs.mode == 'verify' && inputs.run-builds == 'true'
      shell: bash
      env:
        INPUT_PUBLISH_CACHE: ${{ inputs.publish-cache }}
      run: |
        set -euo pipefail
        cache_mode=$(jq -r '.cache.mode // "none"' "$NIX_CI_STATE/manifest.json")
        checkpointed_deps=false
        mapfile -t group_rows < <(jq -r '.groups[] | "\(.name)\t\(.vm // "")"' "$NIX_CI_STATE/manifest.json")
        for row in "${group_rows[@]}"; do
          IFS=$'\t' read -r group_name vm_kind <<< "$row"
          if [[ -n "$vm_kind" && "$checkpointed_deps" == false && "$INPUT_PUBLISH_CACHE" == true && "$cache_mode" == incremental ]]; then
            docker exec "$NIX_CI_CONTAINER" bash -euo pipefail -c \
              'export PATH="$(cat /ci/tools)/bin:$PATH"; nix-ci cache checkpoint --state /ci --phase publish-dependencies'
            checkpointed_deps=true
          fi
          docker exec "$NIX_CI_CONTAINER" bash -euo pipefail -c \
            "export PATH=\"\$(cat /ci/tools)/bin:\$PATH\"; nix-ci build --group \"$group_name\" --state /ci --github-actions"
        done
        docker exec "$NIX_CI_CONTAINER" bash -euo pipefail -c \
          'export PATH="$(cat /ci/tools)/bin:$PATH"; nix-ci report verify --state /ci'
        if [[ "$INPUT_PUBLISH_CACHE" == true && "$cache_mode" == incremental ]]; then
          docker exec "$NIX_CI_CONTAINER" bash -euo pipefail -c \
            'export PATH="$(cat /ci/tools)/bin:$PATH"; nix-ci cache checkpoint --state /ci --phase publish-results --finish'
        fi

    - name: Publish signed cache at end of phase
      id: cache-publish
      if: inputs.mode == 'publish-cache'
      shell: bash
      env:
        ORANC_USERNAME: ${{ github.actor }}
        ORANC_PASSWORD: ${{ github.token }}
        ORANC_SIGNING_KEY: ${{ inputs.signing-key }}
      run: |
        set -euo pipefail
        cache_mode=$(jq -r '.cache.mode // "none"' "$NIX_CI_STATE/manifest.json")
        if [[ "$cache_mode" == none ]]; then
          echo 'result=skipped' >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if bash "$NIX_CI_INFRA_DIR/ci/container.sh" --rm -i \
          --network "container:$NIX_CI_CONTAINER" \
          --memory=12g --memory-swap=20g \
          --volume "$NIX_CI_STORE_VOLUME:/nix" \
          --volume "$NIX_CI_PROJECT_DIR:/workspace:ro" \
          --volume "$NIX_CI_INFRA_DIR:/infra:ro" \
          --volume "$NIX_CI_STATE:/ci" \
          --env ORANC_USERNAME \
          --env ORANC_PASSWORD \
          --env ORANC_SIGNING_KEY \
          -- bash -euo pipefail -c 'export PATH="$(cat /ci/tools)/bin:$PATH"; nix-ci cache publish --project-dir /workspace --state /ci'; then
          echo 'result=success' >> "$GITHUB_OUTPUT"
        else
          echo 'result=failed' >> "$GITHUB_OUTPUT"
          exit 1
        fi

    - name: Stop incremental publisher, collect diagnostics, and render summary
      if: always() && ((inputs.mode == 'verify' && inputs.keep-container != 'true') || inputs.mode == 'finalize')
      shell: bash
      run: |
        set -euo pipefail
        state="${NIX_CI_STATE:-}"
        if [[ -z "$state" || ! -d "$state" ]]; then
          exit 0
        fi
        if [[ -n "${NIX_CI_PUBLISHER:-}" ]] && docker inspect "$NIX_CI_PUBLISHER" >/dev/null 2>&1; then
          docker exec "$NIX_CI_PUBLISHER" bash -euo pipefail -c \
            'export PATH="$(cat /ci/tools)/bin:$PATH"; nix-ci cache stop --state /ci' || true
          docker rm -f "$NIX_CI_PUBLISHER" >/dev/null 2>&1 || true
        fi
        rm -f -- "$state/oranc.netrc"
        touch "$state/monitor.stop"
        if [[ -n "${NIX_CI_CONTAINER:-}" ]] && container_pid=$(docker inspect --format '{{.State.Pid}}' "$NIX_CI_CONTAINER" 2>/dev/null); then
          python3 "$NIX_CI_INFRA_DIR/ci" report sample --state "$state" --container-pid "$container_pid" || true
          docker inspect --format '{{json .State}}' "$NIX_CI_CONTAINER" || true
        fi
        if [[ -f "$state/started" ]]; then
          sudo journalctl -k --since "$(cat "$state/started")" --utc --no-pager -o short-iso \
            --grep='(?i)out of memory|killed process|oom' 2>&1 | tee "$state/oom-kernel.log" > /dev/null || true
          sudo journalctl -u systemd-oomd --since "$(cat "$state/started")" --utc --no-pager -o short-iso \
            2>&1 | tee "$state/oom-userspace.log" > /dev/null || true
        fi
        python3 "$NIX_CI_INFRA_DIR/ci" report summary --state "$state" | tee -a "$GITHUB_STEP_SUMMARY"
        if [[ -n "${NIX_CI_CONTAINER:-}" ]]; then
          docker rm -f "$NIX_CI_CONTAINER" >/dev/null 2>&1 || true
        fi
        if [[ -n "${NIX_CI_STORE_VOLUME:-}" ]]; then
          docker volume rm -f "$NIX_CI_STORE_VOLUME" >/dev/null 2>&1 || true
        fi

    - name: Upload CI diagnostics artifact
      if: always() && ((inputs.mode == 'verify' && inputs.keep-container != 'true') || inputs.mode == 'finalize')
      uses: actions/upload-artifact@v7
      with:
        name: diagnostics-${{ inputs.artifact-suffix }}-${{ github.run_attempt }}
        retention-days: 7
        if-no-files-found: ignore
        path: |
          ${{ steps.export-env.outputs.state-dir }}/manifest.json
          ${{ steps.export-env.outputs.state-dir }}/timings.jsonl
          ${{ steps.export-env.outputs.state-dir }}/evaluation.jsonl
          ${{ steps.export-env.outputs.state-dir }}/publication-paths.jsonl
          ${{ steps.export-env.outputs.state-dir }}/published-paths.json
          ${{ steps.export-env.outputs.state-dir }}/publisher.log
          ${{ steps.export-env.outputs.state-dir }}/cache/status.json
          ${{ steps.export-env.outputs.state-dir }}/resources.jsonl
          ${{ steps.export-env.outputs.state-dir }}/oom-*.log
          ${{ steps.export-env.outputs.state-dir }}/monitor.log
