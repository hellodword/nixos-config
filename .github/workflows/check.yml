name: Public configuration checks

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Enable KVM
        run: |
          sudo modprobe kvm
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Run E2E and public checks in the official Nix image
        # Nix 2.34.9, registry digest verified on 2026-10-29. No host installer.
        env:
          NIX_IMAGE: docker.io/nixos/nix@sha256:53b5ec518b696373829ea305c3c07a8c870113e44648c88ec484ef078550fd4f
        run: |
          docker run --rm --device /dev/kvm \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" --workdir /workspace \
            --env 'NIX_CONFIG=experimental-features = nix-command flakes' \
            "$NIX_IMAGE" bash scripts/ci.sh
