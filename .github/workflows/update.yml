name: Update flake inputs

on:
  schedule:
    - cron: '37 19 * * *'
  workflow_dispatch:
    inputs:
      scope:
        description: Inputs to update
        type: choice
        options: [all, laptop, remote]
        default: all

permissions:
  contents: read

concurrency:
  group: nixos-update
  cancel-in-progress: false

jobs:
  remote:
    if: github.ref == 'refs/heads/master' && inputs.scope != 'laptop'
    permissions:
      contents: write
      pull-requests: write
      packages: write
    uses: ./.github/workflows/update-inputs.yml
    with:
      scope: remote
    secrets:
      NIX_CACHE_SIGNING_KEY: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
  laptop:
    needs: remote
    # Each group starts from the current master, including any preceding merge.
    if: ${{ !cancelled() && github.ref == 'refs/heads/master' && inputs.scope != 'remote' }}
    permissions:
      contents: write
      pull-requests: write
      packages: write
    uses: ./.github/workflows/update-inputs.yml
    with:
      scope: laptop
    secrets:
      NIX_CACHE_SIGNING_KEY: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
