name: Update flake inputs

on:
  schedule:
    - cron: '37 19 * * *'
  workflow_dispatch:
    inputs:
      scope:
        description: Inputs to update
        type: choice
        options: [all, laptop, remote]
        default: all

permissions:
  contents: read

concurrency:
  group: nixos-pipeline
  cancel-in-progress: false

jobs:
  remote:
    if: github.ref == 'refs/heads/master' && inputs.scope != 'laptop'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    permissions:
      contents: write
      pull-requests: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/heads/master
          fetch-depth: 0
          persist-credentials: false

      - name: Update remote flake inputs, verify candidate, and fast-forward master
        uses: ./infra/actions/update
        with:
          select: '{"scope":"remote","hostName":""}'
          signing-key: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
          artifact-name: diagnostics-update-remote
          pre-check: |
            nix build --no-link --print-build-logs --no-update-lock-file .#checks.x86_64-linux.lint
            python3 -sE -m tests.integration.cache --nixpkgs-input nixpkgs-remote
            python3 -sE -m tests.integration.updates

  laptop:
    needs: remote
    # Start from current master, including any preceding remote merge.
    if: ${{ !cancelled() && github.ref == 'refs/heads/master' && inputs.scope != 'remote' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    permissions:
      contents: write
      pull-requests: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/heads/master
          fetch-depth: 0
          persist-credentials: false

      - name: Update laptop flake inputs, verify candidate, and fast-forward master
        uses: ./infra/actions/update
        with:
          select: '{"scope":"laptop","hostName":"laptop2"}'
          signing-key: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
          artifact-name: diagnostics-update-laptop-laptop2
          pre-check: |
            nix build --no-link --print-build-logs --no-update-lock-file .#checks.x86_64-linux.lint
            python3 -sE -m tests.integration.cache --nixpkgs-input nixpkgs
            python3 -sE -m tests.integration.updates
