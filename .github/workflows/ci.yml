name: Verify and cache

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      scope:
        description: Products to verify
        type: choice
        options: [all, laptop, remote]
        default: all
      initialize-cache:
        description: Create the cache package only; then configure Public and Actions Write in Package settings
        type: boolean
        default: false
  workflow_call:
    inputs:
      scope:
        type: string
        default: all
      candidate-artifact:
        type: string
        default: ''
      candidate-sha:
        type: string
        default: ''
    secrets:
      NIX_CACHE_SIGNING_KEY:
        required: true

permissions:
  contents: read

concurrency:
  group: nixos-verify
  cancel-in-progress: false

jobs:
  initialize-cache:
    if: github.event_name == 'workflow_dispatch' && inputs.initialize-cache
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Initialize GHCR cache package
        uses: ./infra/action
        with:
          mode: initialize-cache
          project-dir: .
          select: '{"scope":"laptop","hostName":"laptop2"}'

  verify:
    if: github.event_name != 'workflow_dispatch' || !inputs.initialize-cache
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(
            inputs.scope == 'remote' && '[{"scope":"remote","host":""}]' ||
            inputs.scope == 'laptop' && '[{"scope":"laptop","host":"laptop2"}]' ||
            '[{"scope":"laptop","host":"laptop2"},{"scope":"remote","host":""}]'
          ) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        if: inputs.candidate-artifact != '' && inputs.candidate-artifact != null
        with:
          name: ${{ inputs.candidate-artifact }}
          path: ${{ runner.temp }}/candidate
      - name: Check out candidate commit
        if: inputs.candidate-artifact != '' && inputs.candidate-artifact != null
        env:
          CANDIDATE_SHA: ${{ inputs.candidate-sha }}
        run: |
          git fetch "$RUNNER_TEMP/candidate/candidate.bundle" HEAD
          test "$(git rev-parse FETCH_HEAD)" = "$CANDIDATE_SHA"
          git checkout --detach "$CANDIDATE_SHA"
      - name: Verify manifest, integration suites, VM checks, and signed cache
        uses: ./infra/action
        with:
          mode: verify
          project-dir: .
          select: ${{ format('{{"scope":"{0}","hostName":"{1}"}}', matrix.scope, matrix.host) }}
          publish-cache: ${{ github.ref == 'refs/heads/master' && 'true' || 'false' }}
          signing-key: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
          artifact-suffix: ${{ matrix.scope }}${{ matrix.host != '' && format('-{0}', matrix.host) || '' }}
          pre-build-command: |
            nix build --no-link --print-build-logs --no-update-lock-file .#checks.x86_64-linux.lint
            if [[ "${{ matrix.scope }}" == remote ]]; then nixpkgs_input=nixpkgs-remote; else nixpkgs_input=nixpkgs; fi
            python3 -m tests.integration.cache --nixpkgs-input "$nixpkgs_input"
            python3 -m tests.integration.updates
