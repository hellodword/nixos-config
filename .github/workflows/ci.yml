name: Verify and cache

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      scope:
        description: Products to verify
        type: choice
        options: [all, laptop, remote]
        default: all

permissions:
  contents: read

concurrency:
  group: nixos-pipeline
  cancel-in-progress: false

jobs:
  verify:
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(
            inputs.scope == 'remote' && '[{"scope":"remote","host":""}]' ||
            inputs.scope == 'laptop' && '[{"scope":"laptop","host":"laptop2"}]' ||
            '[{"scope":"laptop","host":"laptop2"},{"scope":"remote","host":""}]'
          ) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify manifest, integration suites, VM checks, and signed cache
        uses: ./infra/actions/verify
        with:
          select: ${{ format('{{"scope":"{0}","hostName":"{1}"}}', matrix.scope, matrix.host) }}
          signing-key: ${{ github.ref == 'refs/heads/master' && secrets.NIX_CACHE_SIGNING_KEY || '' }}
          artifact-name: diagnostics-${{ matrix.scope }}${{ matrix.host != '' && format('-{0}', matrix.host) || '' }}
          pre-check: |
            nix build --no-link --print-build-logs --no-update-lock-file .#checks.x86_64-linux.lint
            if [[ "${{ matrix.scope }}" == remote ]]; then nixpkgs_input=nixpkgs-remote; else nixpkgs_input=nixpkgs; fi
            python3 -sE -m tests.integration.cache --nixpkgs-input "$nixpkgs_input"
            python3 -sE -m tests.integration.updates
