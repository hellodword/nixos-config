name: Verify and cache

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      initialize-cache:
        description: Create the cache package only; then configure Public and Actions Write in Package settings
        type: boolean
        default: false
  workflow_call:
    inputs:
      candidate-artifact:
        type: string
        default: ''
      candidate-sha:
        type: string
        default: ''
    secrets:
      NIX_CACHE_SIGNING_KEY:
        required: true

permissions:
  contents: read

env:
  NIX_IMAGE: docker.io/nixos/nix@sha256:53b5ec518b696373829ea305c3c07a8c870113e44648c88ec484ef078550fd4f

# One verifier/publisher at a time. GitHub retains only the newest pending run.
concurrency:
  group: nixos-verify
  cancel-in-progress: false

jobs:
  initialize-cache:
    if: github.event_name == 'workflow_dispatch' && inputs.initialize-cache
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Require the trusted branch
        run: test "$GITHUB_REF" = refs/heads/master
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Initialize the GHCR cache package
        env:
          ORANC_USERNAME: ${{ github.actor }}
          ORANC_PASSWORD: ${{ github.token }}
        run: |
          # Initialization publishes only nix-cache-info and needs no signing key.
          # Use the same finite descriptor limit as the verification container.
          docker run --rm -i --ulimit nofile=65536:65536 \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" --workdir /workspace \
            --env ORANC_USERNAME --env ORANC_PASSWORD \
            --env NIX_USER_CONF_FILES=/tmp/ci-nix.conf \
            --env 'NIX_CONFIG=experimental-features = nix-command flakes' \
            "$NIX_IMAGE" bash -euo pipefail <<'BASH'
          git config --global --add safe.directory /workspace
          cat > /tmp/ci-nix.conf <<'CONFIG'
          sandbox = false
          accept-flake-config = false
          max-jobs = 1
          cores = 0
          CONFIG
          bash scripts/nix-cache.sh print --public-only >> /tmp/ci-nix.conf
          oranc_root=$(nix build --no-update-lock-file --no-link --print-out-paths .#oranc)
          repository=$(nix eval --raw --file nix/cache-config.nix project.repository)
          "$oranc_root/bin/oranc" push --repository "$repository" --parallel 1 initialize --priority 41
          BASH
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## Cache package initialized

          Open your GitHub profile → Packages → the cache package → Package settings.
          Set visibility to Public, disable inherited repository access, then set this
          repository to Write under Manage Actions access. GitHub initially grants
          the publishing repository package Admin. Public visibility cannot be reversed.

          Run Verify and cache on master again with initialize-cache unchecked.
          SUMMARY
  verify:
    if: github.event_name != 'workflow_dispatch' || !inputs.initialize-cache
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        host: [laptop2]
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    permissions:
      contents: read
      packages: write
    env:
      HOST: ${{ matrix.host }}
      # Bound the uncompressed bootstrap archive, independently of repository quota.
      ORANC_CACHE_MAX_BYTES: '536870912'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        if: inputs.candidate-artifact != '' && inputs.candidate-artifact != null
        with:
          name: ${{ inputs.candidate-artifact }}
          path: ${{ runner.temp }}/candidate
      - name: Check out the candidate commit
        if: inputs.candidate-artifact != '' && inputs.candidate-artifact != null
        env:
          CANDIDATE_SHA: ${{ inputs.candidate-sha }}
        run: |
          git fetch "$RUNNER_TEMP/candidate/candidate.bundle" HEAD
          test "$(git rev-parse FETCH_HEAD)" = "$CANDIDATE_SHA"
          git checkout --detach "$CANDIDATE_SHA"
      - name: Prepare disk, swap, KVM and Nix store
        run: |
          state="$RUNNER_TEMP/nixos-ci"
          mkdir -p "$state" "$RUNNER_TEMP/nixos-build"
          date -u +%FT%TZ > "$state/started"
          df -h / /mnt
          # Fixed SDK allowlist; preserve Docker, Git, gh, runner Node and KVM.
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /usr/share/swift /usr/local/share/boost
          sudo fallocate -l 8G "$state/swap"
          sudo chmod 600 "$state/swap"
          sudo mkswap "$state/swap"
          sudo swapon "$state/swap"
          free -h
          sudo modprobe kvm
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm
          docker volume create nixos-ci-store
          # gawk sizes its pipe table from nofile; near-unlimited defaults can
          # allocate tens of GiB. Bound both limits for all container processes.
          docker run --detach --name nixos-ci --device /dev/kvm \
            --ulimit nofile=65536:65536 \
            --volume nixos-ci-store:/nix \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --volume "$state:/ci" \
            --volume "$RUNNER_TEMP/nixos-build:/build" \
            --workdir /workspace --env TMPDIR=/build --env NIX_USER_CONF_FILES=/ci/nix.conf \
            --env 'NIX_CONFIG=experimental-features = nix-command flakes' \
            "$NIX_IMAGE" sleep infinity
          docker exec nixos-ci git config --global --add safe.directory /workspace
          container_pid=$(docker inspect --format '{{.State.Pid}}' nixos-ci)
          python3 .github/ci/report.py monitor --state "$state" --container-pid "$container_pid" \
            > "$state/monitor.log" 2>&1 &
      - name: Configure public caches and identify oranc
        id: oranc-key
        run: |
          docker exec -i nixos-ci bash -euo pipefail <<'BASH'
          cat > /ci/nix-base.conf <<'CONFIG'
          sandbox = false
          accept-flake-config = false
          system-features = nixos-test benchmark big-parallel kvm
          max-jobs = 1
          cores = 0
          CONFIG
          cat /ci/nix-base.conf > /ci/nix.conf
          bash scripts/nix-cache.sh print --public-only >> /ci/nix.conf
          nix eval --no-update-lock-file --raw .#oranc.outPath > /ci/oranc-root
          BASH
          oranc_root=$(cat "$RUNNER_TEMP/nixos-ci/oranc-root")
          printf 'key=oranc-v1-%s-%s-%s-%s\n' \
            "$RUNNER_OS" "$RUNNER_ARCH" "$ORANC_CACHE_MAX_BYTES" "${oranc_root##*/}" >> "$GITHUB_OUTPUT"
      - name: Restore the oranc bootstrap cache
        id: oranc-restore
        uses: actions/cache/restore@v6
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/nixos-ci/oranc-closure
          key: ${{ steps.oranc-key.outputs.key }}
      - name: Import or build oranc
        id: oranc
        run: |
          python3 .github/ci/report.py run --state "$RUNNER_TEMP/nixos-ci" --phase oranc -- \
            docker exec -i nixos-ci bash -euo pipefail <<'BASH'
          if [[ -f /ci/oranc-closure ]]; then
            if nix-store --import < /ci/oranc-closure; then
              echo 'Imported' > /ci/oranc-import
            else
              echo '::warning::Unable to import the oranc cache; continuing with the normal Nix build.'
              echo 'Failed; using normal Nix build' > /ci/oranc-import
            fi
          else
            echo 'No archive; using normal Nix build' > /ci/oranc-import
          fi
          # Resolve the current output even after a cache hit.
          oranc_root=$(nix build --no-update-lock-file --no-link --print-out-paths .#oranc)
          printf '%s\n' "$oranc_root" > /ci/oranc-root
          printf '%s\n' "$oranc_root/bin/oranc" > /ci/oranc
          nix path-info --closure-size "$oranc_root" > /ci/oranc-size
          BASH
      - name: Prepare the oranc bootstrap archive
        id: oranc-export
        if: github.ref == 'refs/heads/master' && steps.oranc-restore.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          state="$RUNNER_TEMP/nixos-ci"
          read -r _ closure_bytes < "$state/oranc-size"
          if (( closure_bytes > ORANC_CACHE_MAX_BYTES )); then
            echo 'skip-reason=Runtime closure exceeds the size limit' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          archive="$state/oranc-closure"
          trap 'rm -f "$archive.partial"' EXIT
          docker exec nixos-ci bash -euo pipefail -c '
            nix-store --query --requisites "$(cat /ci/oranc-root)" > /ci/oranc-paths
            mapfile -t paths < /ci/oranc-paths
            nix-store --export "${paths[@]}"
          ' > "$archive.partial"
          archive_bytes=$(stat -c %s "$archive.partial")
          echo "archive-bytes=$archive_bytes" >> "$GITHUB_OUTPUT"
          if (( archive_bytes > ORANC_CACHE_MAX_BYTES )); then
            echo 'skip-reason=Exported archive exceeds the size limit' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mv "$archive.partial" "$archive"
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - name: Save the oranc bootstrap cache
        id: oranc-save
        if: github.ref == 'refs/heads/master' && steps.oranc-export.outputs.ready == 'true'
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/nixos-ci/oranc-closure
          key: ${{ steps.oranc-key.outputs.key }}
      - name: Report the oranc bootstrap cache
        if: ${{ !cancelled() && steps.oranc.outcome == 'success' }}
        env:
          CACHE_HIT: ${{ steps.oranc-restore.outputs.cache-hit == 'true' }}
          RESTORE_OUTCOME: ${{ steps.oranc-restore.outcome }}
          EXPORT_OUTCOME: ${{ steps.oranc-export.outcome }}
          SAVE_OUTCOME: ${{ steps.oranc-save.outcome }}
          ARCHIVE_BYTES: ${{ steps.oranc-export.outputs.archive-bytes }}
          SKIP_REASON: ${{ steps.oranc-export.outputs.skip-reason }}
        run: |
          state="$RUNNER_TEMP/nixos-ci"
          read -r _ closure_bytes < "$state/oranc-size"
          if [[ "$CACHE_HIT" == true ]]; then
            SKIP_REASON='Exact cache key already exists'
            ARCHIVE_BYTES=$(stat -c %s "$state/oranc-closure")
          elif [[ "$GITHUB_REF" != refs/heads/master ]]; then
            SKIP_REASON='Cache saving is limited to master'
          fi
          {
            printf '## Oranc bootstrap cache\n\n'
            printf '| Item | Result |\n| --- | --- |\n'
            printf '| Restore | %s; exact hit: %s |\n' "$RESTORE_OUTCOME" "$CACHE_HIT"
            printf '| Import | %s |\n' "$(cat "$state/oranc-import")"
            printf '| Runtime closure (NAR bytes) | %s |\n' "$closure_bytes"
            printf '| Archive bytes | %s |\n' "${ARCHIVE_BYTES:-Not exported}"
            printf '| Size limit (bytes) | %s |\n' "$ORANC_CACHE_MAX_BYTES"
            printf '| Export / save actions | %s / %s |\n' "$EXPORT_OUTCOME" "$SAVE_OUTCOME"
            printf '\n%s\n' "${SKIP_REASON:-See the save action log for the cache service result.}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Start the cache proxy and prepare tools
        run: |
          python3 .github/ci/report.py run --state "$RUNNER_TEMP/nixos-ci" --phase tools -- \
            docker exec -i nixos-ci bash -euo pipefail <<'BASH'
          listen=$(nix eval --raw --file nix/cache-config.nix ci.listen)
          "$(cat /ci/oranc)" server --listen "$listen" > /ci/oranc.log 2>&1 < /dev/null &
          proxy_pid=$!
          for ((attempt=0; attempt<50; attempt++)); do
            if (exec 3<>"/dev/tcp/${listen%:*}/${listen##*:}") 2>/dev/null; then break; fi
            kill -0 "$proxy_pid"
            sleep 0.1
          done
          python_root=$(nix build --no-update-lock-file --no-link --print-out-paths --impure --expr \
            '(builtins.getFlake ("git+file://" + toString ./.)).inputs.nixpkgs.legacyPackages.x86_64-linux.python3')
          cache_uri=$(nix eval --raw --file nix/cache-config.nix ci.uri)
          # A plain GET cannot turn a missing cache into an implicit PUT.
          "$python_root/bin/python3" - "$cache_uri" <<'PY'
          import sys
          import urllib.request
          try:
              with urllib.request.urlopen(sys.argv[1] + '/nix-cache-info', timeout=30) as response:
                  info = response.read().decode()
              if 'StoreDir: /nix/store' not in info:
                  raise ValueError('unexpected nix-cache-info content')
          except Exception as error:
              raise SystemExit(f'Project cache is not anonymously readable: {error}. '
                               'Run the manual initialize-cache entry if needed, then set the '
                               'package to Public and grant this repository Actions Write access.')
          PY
          cat /ci/nix-base.conf > /ci/nix.conf
          bash scripts/nix-cache.sh print --ci >> /ci/nix.conf
          nix develop --no-update-lock-file --command bash -c 'command -v python3' > /ci/python
          BASH
      - name: Verify cache signing identity and write access
        if: github.ref == 'refs/heads/master'
        env:
          ORANC_USERNAME: ${{ github.actor }}
          ORANC_PASSWORD: ${{ github.token }}
          ORANC_SIGNING_KEY: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
        run: |
          docker exec -i --env ORANC_USERNAME --env ORANC_PASSWORD --env ORANC_SIGNING_KEY \
            nixos-ci bash -euo pipefail <<'BASH'
          expected=$(nix eval --raw --file nix/cache-config.nix project.publicKey)
          actual=$(printf '%s' "$ORANC_SIGNING_KEY" | nix key convert-secret-to-public)
          if [[ "$actual" != "$expected" ]]; then
            echo 'NIX_CACHE_SIGNING_KEY does not match the declared cache public key.' >&2
            exit 1
          fi
          repository=$(nix eval --raw --file nix/cache-config.nix project.repository)
          # Anonymous reading already succeeded. Rewrite the same index to
          # verify write access to the existing package before expensive work.
          "$(cat /ci/oranc)" push --repository "$repository" --parallel 1 initialize --priority 41
          BASH
      - name: Static checks and OCI integration
        run: |
          docker exec nixos-ci nix develop --no-update-lock-file --command bash -euo pipefail -c '
            actionlint .github/workflows/*.yml
            shellcheck scripts/nix-cache.sh
            shellcheck -s bash scripts/desktop/screenshot.sh
            find modules home profiles hosts lib nix tests tools -type f -name "*.nix" -print0 | xargs -0 nixfmt --check
            nixfmt --check flake.nix
            python3 -m tests.integration.cache
          '
      - name: Evaluate the build inventory
        id: inventory
        run: |
          docker exec --env HOST nixos-ci bash -euo pipefail -c '
            nix eval --no-update-lock-file --json --impure --expr \
              '\''import ./nix/ci.nix { flake = builtins.getFlake ("git+file://" + toString ./.); hostName = builtins.getEnv "HOST"; }'\'' > /ci/policy.json
          '
      - name: Build systems, non-VM checks and all VM drivers
        id: build
        run: |
          docker exec nixos-ci bash -euo pipefail -c '
            "$(cat /ci/python)" .github/ci/build.py private --state /ci
            "$(cat /ci/python)" .github/ci/build.py dependencies --state /ci
          '
      - name: Publish completed dependency paths
        id: publish-dependencies
        if: ${{ !cancelled() && github.ref == 'refs/heads/master' && steps.inventory.outcome == 'success' && steps.build.outcome != 'skipped' }}
        env:
          ORANC_USERNAME: ${{ github.actor }}
          ORANC_PASSWORD: ${{ github.token }}
          ORANC_SIGNING_KEY: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
        run: |
          python3 .github/ci/report.py run --state "$RUNNER_TEMP/nixos-ci" --phase publish-dependencies -- \
            docker exec -i --env ORANC_USERNAME --env ORANC_PASSWORD --env ORANC_SIGNING_KEY nixos-ci \
            bash -euo pipefail <<'BASH'
          "$(cat /ci/python)" .github/ci/cache.py select --state /ci
          "$(cat /ci/python)" .github/ci/cache.py publish --state /ci --phase publish-dependencies
          BASH
      - name: Run network and backup VM tests
        id: network-backup
        if: ${{ !cancelled() && steps.build.outcome == 'success' && (github.ref != 'refs/heads/master' || steps.publish-dependencies.outcome == 'success') }}
        run: docker exec nixos-ci bash -euo pipefail -c '"$(cat /ci/python)" .github/ci/build.py vm-network-backup --jobs 2 --state /ci'
      - name: Run desktop VM tests
        id: desktop
        if: ${{ !cancelled() && steps.build.outcome == 'success' && (github.ref != 'refs/heads/master' || steps.publish-dependencies.outcome == 'success') }}
        run: docker exec nixos-ci bash -euo pipefail -c '"$(cat /ci/python)" .github/ci/build.py vm-desktop --state /ci'
      - name: Run application VM tests
        id: applications
        if: ${{ !cancelled() && steps.build.outcome == 'success' && (github.ref != 'refs/heads/master' || steps.publish-dependencies.outcome == 'success') }}
        run: docker exec nixos-ci bash -euo pipefail -c '"$(cat /ci/python)" .github/ci/build.py vm-applications --state /ci'
      - name: Assemble VM results
        if: ${{ !cancelled() && steps.network-backup.outcome == 'success' && steps.desktop.outcome == 'success' && steps.applications.outcome == 'success' }}
        run: docker exec nixos-ci bash -euo pipefail -c '"$(cat /ci/python)" .github/ci/build.py aggregate --state /ci'
      - name: Publish newly completed paths
        if: ${{ !cancelled() && github.ref == 'refs/heads/master' && steps.build.outcome == 'success' && steps.publish-dependencies.outcome == 'success' }}
        env:
          ORANC_USERNAME: ${{ github.actor }}
          ORANC_PASSWORD: ${{ github.token }}
          ORANC_SIGNING_KEY: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
        run: |
          python3 .github/ci/report.py run --state "$RUNNER_TEMP/nixos-ci" --phase publish-results -- \
            docker exec -i --env ORANC_USERNAME --env ORANC_PASSWORD --env ORANC_SIGNING_KEY nixos-ci \
            bash -euo pipefail <<'BASH'
          "$(cat /ci/python)" .github/ci/cache.py select --state /ci
          "$(cat /ci/python)" .github/ci/cache.py publish --state /ci --phase publish-results
          BASH
      - name: Report timings and resources
        if: always()
        run: |
          state="$RUNNER_TEMP/nixos-ci"
          mkdir -p "$state"
          touch "$state/monitor.stop"
          if container_pid=$(docker inspect --format '{{.State.Pid}}' nixos-ci); then
            python3 .github/ci/report.py sample --state "$state" --container-pid "$container_pid" || true
            docker inspect --format '{{json .State}}' nixos-ci
          fi
          if [[ -f $state/started ]]; then
            sudo journalctl -k --since "$(cat "$state/started")" --utc --no-pager -o short-iso \
              --grep='(?i)out of memory|killed process|oom' 2>&1 | tee "$state/oom-kernel.log" > /dev/null || true
            sudo journalctl -u systemd-oomd --since "$(cat "$state/started")" --utc --no-pager -o short-iso \
              2>&1 | tee "$state/oom-userspace.log" > /dev/null || true
          fi
          python3 .github/ci/report.py summary --state "$state" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: diagnostics-${{ matrix.host }}-${{ github.run_attempt }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/nixos-ci/timings.jsonl
            ${{ runner.temp }}/nixos-ci/publication-paths.jsonl
            ${{ runner.temp }}/nixos-ci/resources.jsonl
            ${{ runner.temp }}/nixos-ci/oom-*.log
            ${{ runner.temp }}/nixos-ci/monitor.log
            ${{ runner.temp }}/nixos-ci/oranc.log
