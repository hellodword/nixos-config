name: Configure Nix CI environment
description: Export Nix container settings and initialize base nix.conf
runs:
  using: composite
  steps:
    - name: Export Nix CI environment and initialize nix.conf
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        NIX_IMAGE: docker.io/nixos/nix@sha256:53b5ec518b696373829ea305c3c07a8c870113e44648c88ec484ef078550fd4f
      run: |
        set -euo pipefail
        state="$RUNNER_TEMP/nixos-ci"
        mkdir -p "$state"
        cat > "$state/nix-base.conf" <<'CONFIG'
        experimental-features = nix-command flakes
        sandbox = false
        accept-flake-config = false
        system-features = nixos-test benchmark big-parallel kvm
        max-jobs = 1
        cores = 0
        fallback = true
        max-substitution-jobs = 4
        http-connections = 8
        CONFIG
        cp "$state/nix-base.conf" "$state/nix.conf"

        nix_config=$(printf 'experimental-features = nix-command flakes\naccess-tokens = github.com=%s\n' "$GITHUB_TOKEN")
        delimiter="EOF_$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')"
        {
          printf 'NIX_IMAGE=%s\n' "$NIX_IMAGE"
          printf 'NIX_CI_STATE=%s\n' "$state"
          printf 'NIX_USER_CONF_FILES=/ci/nix.conf\n'
          printf 'NIX_CONFIG<<%s\n%s\n%s\n' "$delimiter" "$nix_config" "$delimiter"
        } >> "$GITHUB_ENV"

        export NIX_CI_STATE="$state" NIX_USER_CONF_FILES=/ci/nix.conf NIX_CONFIG="$nix_config"
        bash "$GITHUB_WORKSPACE/.github/ci/nix-container.sh" --rm \
          --volume "$GITHUB_WORKSPACE:/workspace:ro" \
          --volume "$state:/ci:ro" \
          -- bash scripts/nix-cache.sh print --public-only >> "$state/nix.conf"
