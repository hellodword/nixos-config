# 按 [[rules]] 顺序首次匹配。domain 同时生成 DNS 和连接规则；connection 只参与连接分流。
# 匹配条件沿用 sing-box；shadowrocket 只填写该格式的匹配表达式，动作由同一条规则提供。
# 可选用途未绑定时使用 proxy；最终未命中的域名和连接使用 hideme。
final = "hideme"

[seeds]
sing-box-geosite = "https://raw.githubusercontent.com/lyc8503/sing-box-rules/rule-set-geosite/"
sing-box-geoip = "https://raw.githubusercontent.com/lyc8503/sing-box-rules/rule-set-geoip/"

[rule_set_defaults]
type = "remote"
format = "binary"
update_interval = "24h"
http_client.detour = "proxy"

# PCDN 在国内直连及业务用途之前拒绝。
[[rules]]
scope = "domain"
rule_set = ["pcdn"]
action = "reject"

# SSH/RDP 先解析真实目标，再按公网 IP 归属分流：国内 direct，其余 hideme。
# sing-box 还按嗅探出的应用协议匹配非标准端口。
[[rules]]
scope = "connection"
type = "logical"
mode = "or"
rules = [{ port = [22, 222, 2222, 3389] }, { protocol = ["ssh", "rdp"] }]
action = "resolve"

[[rules]]
scope = "connection"
type = "logical"
mode = "and"
rules = [
  { type = "logical", mode = "or", rules = [{ port = [22, 222, 2222, 3389] }, { protocol = ["ssh", "rdp"], shadowrocket = [] }] },
  { rule_set = ["geoip-cn"] },
]
action = "route"
outbound = "direct"

[[rules]]
scope = "connection"
port = [22, 222, 2222, 3389]
action = "route"
outbound = "hideme"

[[rules]]
scope = "connection"
protocol = ["ssh", "rdp"]
shadowrocket = []
action = "route"
outbound = "hideme"

# 下载优先于站点分类：包括 GitHub release/GHCR、共享 Google 存储及系统和软件更新。
# 共享存储中的附件也走 downloads。F-Droid HTTPS 镜像来源：
# https://gitlab.com/fdroid/fdroiddata/-/blob/master/config/mirrors.yml
