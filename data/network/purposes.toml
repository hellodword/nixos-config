rule_set = [
  "geosite-alibaba@!cn",
  "geosite-alibabacloud@!cn",
  "geosite-aliyun@!cn",
  "geosite-bilibili@!cn",
  "geosite-bytedance@!cn",
  "geosite-huawei@!cn",
  "geosite-huaweicloud@!cn",
  "geosite-jd@!cn",
  "geosite-qcloud@!cn",
  "geosite-tiktok@!cn",
  "geosite-xiaomi@!cn",
]
action = "route"
outbound = "proxy"

[[rules]]
