action = "route"
outbound = "downloads"

[[rules]]
scope = "domain"
rule_set = ["geosite-docker", "geosite-apple-update", "geosite-f-droid"]
action = "route"
outbound = "downloads"

# 应用自行发起的加密 DNS 同样按真实目标 IP 分流。
# 解析服务域名使用 hideme 查询地址；系统 DNS 仍使用各用途对应的解析出口。
[[rules]]
scope = "connection"
type = "logical"
mode = "or"
rules = [{ rule_set = ["geosite-category-doh"] }, { port = [853], network = "tcp" }]
action = "resolve"

[[rules]]
scope = "connection"
type = "logical"
mode = "and"
rules = [
  { type = "logical", mode = "or", rules = [{ rule_set = ["geosite-category-doh"] }, { port = [853], network = "tcp" }] },
  { rule_set = ["geoip-cn"] },
]
action = "route"
outbound = "direct"

[[rules]]
scope = "domain"
rule_set = ["geosite-category-doh"]
action = "route"
outbound = "hideme"

[[rules]]
scope = "connection"
port = [853]
network = "tcp"
action = "route"
outbound = "hideme"

[[rules]]
scope = "domain"
rule_set = ["geosite-category-cryptocurrency"]
action = "route"
outbound = "cryptocurrency"

[[rules]]
scope = "domain"
rule_set = ["geosite-openai", "geosite-anthropic"]
action = "route"
outbound = "ai"

[[rules]]
scope = "domain"
rule_set = ["geosite-paypal", "geosite-stripe"]
action = "route"
outbound = "payment"

[[rules]]
scope = "domain"
rule_set = ["geosite-giffgaff"]
action = "route"
outbound = "giffgaff"

[[rules]]
scope = "domain"
rule_set = ["geosite-linuxdo"]
action = "route"
outbound = "linuxdo"

[[rules]]
scope = "domain"
domain_suffix = ["hybgzs.com"]
action = "route"
outbound = "linuxdo"

# YouTube、Apple TV 先于 Google、Apple 的通用分类。
[[rules]]
scope = "domain"
rule_set = [
  "geosite-netflix",
  "geosite-hulu",
  "geosite-hbo",
  "geosite-disney",
  "geosite-spotify",
  "geosite-primevideo",
  "geosite-youtube",
