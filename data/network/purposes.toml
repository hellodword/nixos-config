# 已收录的国内站点直连。
[[rules]]
scope = "domain"
rule_set = ["geosite-geolocation-cn"]
action = "route"
outbound = "direct"

# 带域名的连接到这里即使用 hideme，解析到国内 IP 也保持此选择。
# Shadowrocket 的后续 IP 规则使用 no-resolve，带域名的请求由 FINAL 处理。
[[rules]]
scope = "connection"
domain_regex = ["."]
shadowrocket = []
action = "route"
outbound = "hideme"

[[rules]]
scope = "connection"
rule_set = ["geoip-telegram", "geoip-tor"]
action = "route"
outbound = "hideme"

[[rules]]
scope = "connection"
rule_set = ["geoip-netflix"]
action = "route"
outbound = "streaming"

[[rules]]
scope = "connection"
rule_set = ["geoip-facebook", "geoip-twitter"]
action = "route"
outbound = "social"

# Apple 公布的 APNs 网段：https://support.apple.com/101555
[[rules]]
scope = "connection"
ip_cidr = [
  "17.188.128.0/18",
  "17.188.20.0/23",
  "17.249.0.0/16",
  "17.252.0.0/16",
  "17.57.144.0/22",
  "2403:300:a42::/48",
  "2403:300:a51::/48",
  "2620:149:a44::/48",
  "2a01:b740:a42::/48",
]
action = "route"
outbound = "apns"

# 只有无域名连接继续按国内 IP 直连；其余使用 final。
[[rules]]
scope = "connection"
rule_set = ["geoip-cn"]
action = "route"
outbound = "direct"

