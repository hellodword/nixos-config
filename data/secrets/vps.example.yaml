# 所有地址、密钥和密码均为公开占位示例；在私密临时目录填写。
# 按 docs/vps.md 将整份 YAML 作为 SOPS binary 输入加密为 secrets/vps.sops.yaml，
# 节点名称、地址和拓扑也随正文加密。维护机保存解密身份。
#
# 本例有 edge、west 两台 VPS；primary 订阅可经任一入口使用两台 VPS 的原生出口。
# 注释中的可选配置按需启用；对应的秘密引用一并填写到末尾 secrets 中。

# 所有供应商防火墙统一开放 UDP 20000–29999、SSH 实际 TCP 端口和 TCP 443。
# 每台 VPS 使用唯一的 udpSlot（0–9999），Hysteria2 端口为 20000 + udpSlot。
# 例如连接 edge:20001，流量会转发到 west；端口由承载出口的 VPS 决定。

# 节点、出口、订阅及用途的标识以小写字母开头，可含小写字母、数字、连字符，最长 48 字符。
nodes:
  edge:
    # 供应商分配的公网 IPv4：供客户端接入、节点间转发，并作为 SSH 的 HostName。
    address: 192.0.2.10
    # 此 VPS 的唯一代理 SNI，必须被 workers.certificates.domain 获取的证书覆盖。
    serverName: edge.example.com
    # 在所有节点中唯一；已有客户端依赖这个端口，新增节点时使用空闲 slot。
    udpSlot: 0
    # 按供应商实际启动方式选择：false 为 BIOS/GRUB，true 为 UEFI/systemd-boot。
    uefi: false
    # 目标系统盘从供应商控制台或救援系统确认；首次启动自动扩容至整盘。
    disk: /dev/vda
    # 安装后的系统使用 eth0 等顺序网卡名；默认 eth0，可省略。救援系统名称可能不同。
    interface: eth0
    dhcp: true
    # 静态网络时替换上面的 dhcp，并按供应商分配填写 CIDR、网关和系统 DNS：
    # dhcp: false
    # addresses: [192.0.2.10/24, '2001:db8:10::10/64']
    # gateway: 192.0.2.1
    # nameservers: ['1.1.1.1#one.one.one.one', '8.8.8.8#dns.google']
    # 系统 DNS 使用严格 DoT；每项为解析器 IP#TLS证书名，DHCP 仍负责地址和路由。

    # VPS 允许以 root 登录的 OpenSSH 公钥，可填写多把。
    authorizedKeys:
      - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA example"
    # 节点名 edge 同时用作 SSH 主别名和 Colmena 节点名；这里只列额外 SSH 别名，可省略。
    sshAliases:
      - edge-alias-1
    # SSH User 为 root；端口默认 22，同时用于 VPS 的 sshd 监听和维护机连接。
    # sshPort: 22
    # laptop 的 identity.sops.yaml 中，ssh.hosts 按主机名或模式声明身份、代理和跳板策略。
    # 例如以下原生 SSH 配置适用于本例两台 VPS 及其额外别名：
    #   Host edge edge-* west west-*
    #     IdentitiesOnly yes
    #     IdentityFile /etc/ssh/gpg.vps.<16 位长 Key ID>.pub
    #     PreferredAuthentications publickey
    #     ProxyCommand nc -v -x localhost:10800 %h %p
    # address、sshPort 和别名在此清单维护；IdentityFile 指向维护机已发布的 GPG SSH 公钥。

    # 可选：磁盘 swap 默认 1024 MiB；tags 用于 Colmena 选择节点。
    # swapMiB: 512
    # tags: [asia, small]

    # 引用末尾 secrets 中的取证 token；每台 VPS 使用独立值。
    certificateToken: edge-certificate
    # 完整系统的节点专属 NixOS 服务：先创建相应模块，再填写仓库相对路径。
    # modules: [hosts/edge/services.nix]
    # HTTPS 网页域名映射到本机应用；域名需被同一证书覆盖，并与代理 SNI 区分。
    # web:
    #   app.example.com: http://127.0.0.1:8080
  west:
    address: 192.0.2.11
    serverName: west.example.com
    udpSlot: 1
    uefi: true
    disk: /dev/vda
    interface: eth0
    dhcp: true
    authorizedKeys:
      - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA example"
    certificateToken: west-certificate

# nodes 列出可以承载该出口的 VPS；这些 VPS 各自执行认证、解密和最终出站。
# 原生出口对应一台 VPS；上游出口可填写多台，让同一出口拥有多条独立路径。
# ipv6 控制该出口是否允许 IPv6 目标，默认 false；udp 控制是否允许 UDP 目标，默认 true。
# 能力按实际出口填写；客户端自身的 IPv4-only 策略仍会生效。
exits:
  edge-native:
    nodes: [edge]
    type: native
    ipv6: false
    udp: true
    # 目标 DNS 经此出口发送，默认解析器列表在 data/network/vps-dns.json。
    # dns 使用 sing-box 原生 DNS server 数组；解析器 IP 与 TLS 身份分别填写。
    # 多个解析器并发查询，采用最先完成的有效应答。
    # dns:
    #   - type: https
    #     server: 1.1.1.1
    #     path: /dns-query
    #     tls: {enabled: true, server_name: cloudflare-dns.com}
  west-native:
    nodes: [west]
    type: native
    ipv6: true
    udp: true

  # options 使用 sing-box 对应 outbound/endpoint 的原生字段。
  # 其中 {secret: 名称} 会替换为末尾 secrets 中的值，可用于字符串、数组或多行 PEM。
  # 原生配置参考：https://sing-box.sagernet.org/configuration/endpoint/
  #
  # 标准 WireGuard；WARP 使用其提供的 WireGuard 参数。端点运行在 sing-box 用户态。
  # address 填隧道内地址，peers.address/port 填上游的公网地址与端口。
  # https://sing-box.sagernet.org/configuration/endpoint/wireguard/
  # west-warp:
  #   nodes: [west]
  #   type: wireguard
  #   ipv6: true
  #   udp: true
  #   options:
  #     address: [172.16.0.2/32, '2001:db8:20::2/128']
  #     private_key: {secret: west-warp-key}
  #     peers:
  #       - address: 192.0.2.100
  #         port: 2408
  #         public_key: REPLACE_WITH_PROVIDER_WIREGUARD_PUBLIC_KEY
  #         allowed_ips: [0.0.0.0/0, '::/0']
  #         # 若供应商提供 reserved 字节，在此按原值增加 reserved: [0, 0, 0]。
  #
  # SOCKS5：按上游实际能力设置 ipv6、udp；下例适用于仅支持 IPv4/TCP 的服务。
  # us:
  #   nodes: [edge, west]
  #   type: socks
  #   ipv6: false
  #   udp: false
  #   options:
  #     server: 192.0.2.101
  #     server_port: 1080
  #     username: {secret: west-socks-user}
  #     password: {secret: west-socks-password}
  #
  # OpenVPN 使用 sing-box 原生用户态 endpoint，多 VPS 共用上游时可优先考虑 TCP。
  # udp 描述隧道内允许的目标流量，network 描述连接上游使用的传输协议。
  # 按供应商 .ovpn 文件填写认证、CA 和证书名等参数。
  # https://sing-box.sagernet.org/configuration/endpoint/openvpn-client/
  # west-vpn:
  #   nodes: [edge, west]
  #   type: openvpn-client
  #   ipv6: false
  #   udp: true
  #   options:
  #     server: 192.0.2.102
  #     server_port: 1194
  #     network: tcp
  #     username: {secret: west-vpn-user}
  #     password: {secret: west-vpn-password}
  #     tls:
  #       # 对应 verify-x509-name；name 表示精确匹配证书的 CN。
  #       server_name: vpn.example.net
  #       server_name_type: name
  #       certificate: {secret: west-vpn-ca}
  #       # 上游要求双向证书时，再加入这两个字段：
  #       # client_certificate: {secret: west-vpn-certificate}
  #       # client_key: {secret: west-vpn-key}

subscriptions:
  primary:
    # 订阅名称供维护时识别，同一订阅可导入多个客户端。
    # 生成随机 UUID：python3 -c 'import uuid; print(uuid.uuid4())'，在前面加 /。
    # path 拼接在 Cloudflare Worker 路由前缀之后，完整 HTTPS 地址是订阅访问凭据。
    # 这里的公开示例须替换，填好后保持稳定。
    path: /35f4c777-f5ad-43d1-8f53-a736d5ccab62
    # 每份订阅用 openssl rand -hex 32 生成一把独立密钥；保持引号，按字符串保存。
    # 各出口的 Trojan、Hysteria2 密码由它派生。替换 key 后，部署 VPS、发布订阅并更新客户端。
    key: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    # 允许选用的入口 VPS；省略 entries 时使用全部 nodes。
    entries: [edge, west]
    # 允许使用的出口；生成器为其建立代理路径，并在各承载 VPS 启用对应认证身份。
    # 启用上面的可选出口后，将其名称加入此列表，再在 groups 中选择。
    exits: [edge-native, west-native]

    # 用途组选取已授权的出口；单出口自动选中，多出口用 default 指定初始选择。
    # default 必须属于该组的 exits；客户端已保存的有效选择优先。
    # proxy 为必需组，用于通用海外规则和未绑定的用途；hideme 用于隐私站点及最终兜底。
    # 同一出口按“入口 × 承载 VPS × 协议”测速，可在 exit-<名称> 中固定具体路径。
    # 不同逻辑出口由用户选择；多个用途选中同一出口时共享其路径选择。
    # 业务用途及匹配顺序见 data/network/purposes.toml，可按需添加绑定。
    # 多个用途可指向同一出口，仍各自保存用途选择。下载通常选择 VPS native。
    groups:
      proxy: {exits: [edge-native, west-native], default: edge-native}
      hideme: {exits: [west-native]}
      downloads: {exits: [edge-native, west-native], default: edge-native}
      cryptocurrency: {exits: [west-native]}
      ai: {exits: [west-native]}
      streaming: {exits: [edge-native, west-native], default: west-native}
      payment: {exits: [west-native]}
      google: {exits: [edge-native, west-native], default: edge-native}
      tiktok: {exits: [edge-native, west-native], default: edge-native}
      giffgaff: {exits: [west-native]}
      social: {exits: [west-native]}
      microsoft: {exits: [edge-native, west-native], default: edge-native}
      apple: {exits: [edge-native, west-native], default: edge-native}
      apns: {exits: [edge-native, west-native], default: edge-native}

  # 另一份订阅可以拥有不同的入口、出口和用途选择。
  # guest:
  #   path: /7ae7d48e-6d6c-4b0d-b108-72eb8c20ed7b
  #   key: "fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210"
  #   entries: [edge]
  #   exits: [west-native]
  #   groups:
  #     proxy: {exits: [west-native]}

workers:
  subscriptions:
    # Worker 名称用于 Wrangler 部署；路由在 Cloudflare 控制台维护。
    name: vps-subscriptions
    # Route 示例：https://example.com/<worker-route-uuid>*
    # 订阅地址：https://example.com/<worker-route-uuid><subscriptions.path>
    # 也可显式添加 ?client=linux、?client=sing-box 或 ?client=shadowrocket。
  certificates:
    name: vps-certificates
    # 证书 Worker 使用另一条控制台路由，url 填写去掉末尾 * 的完整 HTTPS 基地址。
    # 节点请求地址为 <url>/<节点名称>；将示例域名和路由 UUID 替换后加密保存。
    url: https://example.com/8bca53ec-4607-4fa5-a78a-a97f44a3669e
    # Porkbun 上的证书所属域名；取回的证书应覆盖所有节点 serverName 和 web 域名。
    # 例如这里使用 example.com 及 *.example.com 的证书服务两台 VPS。
    domain: example.com
    # 两项均为 secrets 的键名；API 凭据交给证书 Worker，节点只收到各自的取证 token。
    apiKey: porkbun-api
    secretKey: porkbun-secret

# 证书获取 token 分别运行 openssl rand -hex 32 生成，每个引用使用独立随机值。
# WireGuard/OpenVPN/API 凭据保留供应商提供的原值；多行证书、私钥用 YAML | 保留换行。
# certificateToken、apiKey、secretKey 直接填这里的键名；
# exits.*.options 内通过 {secret: 键名} 引用。
secrets:
  edge-certificate: example-edge-certificate-replace
  west-certificate: example-west-certificate-replace
  porkbun-api: example-api-key-replace
  porkbun-secret: example-secret-key-replace

  # 对应上方按需启用的出口：
  # west-warp-key: REPLACE_WITH_PROVIDER_WIREGUARD_PRIVATE_KEY
  # west-socks-user: REPLACE_WITH_SOCKS_USERNAME
  # west-socks-password: REPLACE_WITH_SOCKS_PASSWORD
  # west-vpn-user: REPLACE_WITH_OPENVPN_USERNAME
  # west-vpn-password: REPLACE_WITH_OPENVPN_PASSWORD
  # west-vpn-ca: |
  #   -----BEGIN CERTIFICATE-----
  #   REPLACE_WITH_PROVIDER_CA_CERTIFICATE
  #   -----END CERTIFICATE-----
  # west-vpn-certificate: |
  #   -----BEGIN CERTIFICATE-----
  #   REPLACE_WITH_OPENVPN_CLIENT_CERTIFICATE
  #   -----END CERTIFICATE-----
  # west-vpn-key: |
  #   -----BEGIN PRIVATE KEY-----
  #   REPLACE_WITH_OPENVPN_CLIENT_PRIVATE_KEY
  #   -----END PRIVATE KEY-----
