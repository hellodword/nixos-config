# 所有值均为公开占位示例；复制到私密目录填写，再加密为 system.sops.yaml。
# YAML 的 | 保留换行，适合内嵌完整配置文件；未使用的可选字符串可写为 ""。
login:
  # 本地运行 nix develop --command mkpasswd -m yescrypt，填写输出的完整 hash。
  passwordHash: "REPLACE_WITH_MKPASSWD_HASH"
tailscale:
  # 从 Tailscale 控制台取得设备注册 key；已有设备身份另行持久化。
  authKey: "REPLACE_WITH_TAILSCALE_AUTH_KEY"
wifi:
  # systemd EnvironmentFile：每个网络一对变量，SSID 与密码都只写在密文中。
  # 变量名须与 hosts/laptop2/secrets.nix 中 ensureProfiles 的 $变量引用一致。
  # HOME / TRAVEL / IPHONE / MIFI 对应当前主机四个 profile；这些名称不包含真实 SSID。
  # 单引号内的空格、$ 和双引号按原样保留；值含单引号时改用双引号。
  environment: |
    HOME_SSID='示例家庭 Wi-Fi'
    HOME_PSK='REPLACE_WITH_HOME_PASSWORD'
    TRAVEL_SSID='示例旅行 Wi-Fi'
    TRAVEL_PSK='REPLACE_WITH_TRAVEL_PASSWORD'
    IPHONE_SSID='示例手机热点'
    IPHONE_PSK='REPLACE_WITH_PHONE_PASSWORD'
    MIFI_SSID='示例移动路由器'
    MIFI_PSK='REPLACE_WITH_MIFI_PASSWORD'
notifications:
  # Bark 客户端的 APNs device token；不是 Bark 服务端生成的 device key。
  barkDeviceToken: "REPLACE_WITH_BARK_APNS_DEVICE_TOKEN"
  # 原生 Apprise YAML，可放多个带 tag 的通道；Bark 由服务自动提供。
  # 下面三个通道均需替换机器人凭据；只用 Bark 时将此字段写为 "urls: []\n"。
  # 例如 site-notify send --channel wecom --title '结果' '正文'。
  channels: |
    urls:
      - wecombot://REPLACE_WEBHOOK_KEY:
        - tag: wecom
      - dingtalk://REPLACE_SIGNING_SECRET@REPLACE_ACCESS_TOKEN:
        - tag: dingtalk
      - feishu://REPLACE_WEBHOOK_TOKEN:
        - tag: feishu
files:
  # HTTPS 与 SMB 共用账号密码，分别填写独立的长随机密码。
  adminPassword: "REPLACE_WITH_FILES_ADMIN_PASSWORD"
  guestPassword: "REPLACE_WITH_FILES_GUEST_PASSWORD"
  # HTTPS 访问使用的域名与 IP；通过 SOPS 编辑时添加实际地址。
  certificateNames:
    - localhost
    - 127.0.0.1
    - "::1"
    # 域名通配符需加引号，只覆盖一级子域名：
    # - "*.example.test"
# 可选资料，仅保存原始文本；这些字段目前不接入任何服务。
# 不需要的字段可留空，下面展示 WireGuard 私钥和两行账户文件的形状。
retained:
  # 单个 WireGuard 私钥，保持原始一行内容。
  wgcfPrivateKey: "REPLACE_WITH_WIREGUARD_PRIVATE_KEY"
  # 两行分别为用户名与密码，按原提供方的文件格式保存。
  fastestvpn: |
    REPLACE_WITH_USERNAME
    REPLACE_WITH_PASSWORD
  goose: |
    REPLACE_WITH_USERNAME
    REPLACE_WITH_PASSWORD
