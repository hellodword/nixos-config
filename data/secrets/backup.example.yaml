# 复制到私密目录填写，再加密为 backup.sops.yaml。
# 三个独立 Restic 仓库共用此加密密码；恢复已有仓库时填写原密码。
# 此密码用于 Restic 数据加密，下面的 S3 凭据用于访问对象存储。
password: "REPLACE_WITH_RESTIC_PASSWORD"
# 名称与 hosts/laptop2/secrets.nix 中的 providers 对应；每个目标独立运行备份。
# url = s3:https://提供方端点/bucket/仓库前缀；从控制台确认端点和区域。
# environment 是完整的 systemd EnvironmentFile，每行一个变量。
repositories:
  scaleway:
    # 示例使用巴黎区域；bucket 与 laptop2 前缀按自己的仓库填写。
    url: "s3:https://s3.fr-par.scw.cloud/EXAMPLE_BUCKET/laptop2"
    environment: |
      AWS_ACCESS_KEY_ID=REPLACE_LOCALLY
      AWS_SECRET_ACCESS_KEY=REPLACE_LOCALLY
  r2:
    # EXAMPLE_ACCOUNT 是 Cloudflare account ID。
    url: "s3:https://EXAMPLE_ACCOUNT.r2.cloudflarestorage.com/EXAMPLE_BUCKET/laptop2"
    environment: |
      AWS_ACCESS_KEY_ID=REPLACE_LOCALLY
      AWS_SECRET_ACCESS_KEY=REPLACE_LOCALLY
  b2:
    # 使用 B2 的 S3 兼容端点；分别填写 key ID 与 application key。
    url: "s3:https://s3.us-west-004.backblazeb2.com/EXAMPLE_BUCKET/laptop2"
    environment: |
      AWS_ACCESS_KEY_ID=REPLACE_LOCALLY
      AWS_SECRET_ACCESS_KEY=REPLACE_LOCALLY
