# 在私密目录填写，再加密为 identity.sops.yaml；以下密钥与指纹均为占位示例。
# 多行内容使用 |；不使用 SSH 时设 gpg.ssh: {}，不使用签名时设 signingKey: null。
gpg:
  # 包含所选子密钥的完整 OpenPGP 公钥证书，可合并多个 ASCII armor 公钥块。
  # 用 gpg --armor --export 主密钥指纹1 主密钥指纹2 导出；系统只在隔离的公钥环中解析。
  publicKeys: |
    -----BEGIN PGP PUBLIC KEY BLOCK-----

    REPLACE_WITH_FIRST_ARMORED_PUBLIC_KEY
    -----END PGP PUBLIC KEY BLOCK-----

    -----BEGIN PGP PUBLIC KEY BLOCK-----

    REPLACE_WITH_SECOND_ARMORED_PUBLIC_KEY
    -----END PGP PUBLIC KEY BLOCK-----
  # 用途名对应具备 [A] 能力的子密钥完整指纹，不填 keygrip 或短 Key ID。
  # gpg --list-keys --keyid-format long --with-subkey-fingerprint --with-keygrip
  # 自动导出 /etc/ssh/gpg.<用途>.<16 位长 Key ID>.pub，并启用本机已有的对应 GPG SSH 身份。
  # 缺少 GPG 密钥或智能卡引用时，用户注册服务明确报告；换钥后旧身份由本人确认并停用。
  ssh:
    github: "0123456789ABCDEF0123456789ABCDEF01234567"
    ios: "89ABCDEF0123456789ABCDEF0123456789ABCDEF"
  # 具备 [S] 能力的子密钥完整指纹。Git 的 user.signingKey 自动由此生成。
  # 在需要签名的 Git 仓库运行 git signing，即可启用提交和 tag 签名。
  signingKey: "FEDCBA9876543210FEDCBA9876543210FEDCBA98"
ssh:
  # 原生 OpenSSH 配置；IdentityFile 写完整路径，没有项目自定义占位符。
  # 路径末段取上方子密钥的长 Key ID；更换子密钥时同步更新指纹和路径。
  # 公钥文件用于选择 agent 中的私钥；私钥或智能卡由本机 ~/.gnupg 管理。
  # ~/.ssh/hosts.d/*.conf 先加载，可添加本机 Host 配置。
  hosts: |
    Host github.com
      User git
      ProxyCommand nc -x 127.0.0.1:10800 %h %p
      IdentityFile /etc/ssh/gpg.github.89ABCDEF01234567.pub
      IdentitiesOnly yes

    Host ios
      HostName phone.example.invalid
      User mobile
      IdentityFile /etc/ssh/gpg.ios.0123456789ABCDEF.pub
      IdentitiesOnly yes
git:
  # 原生 Git config include；签名子密钥统一在 gpg.signingKey 声明。
  # 本机 ~/.config/git/local.inc 最后加载，可覆盖身份与签名选择。
  identity: |
    [user]
      name = Example User
      email = example@example.invalid
